name: unpack-audio
on:
  push:
    paths:
      - 'audio-pack.b64'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode audio pack
        run: |
          base64 -d audio-pack.b64 > audio-pack.zip
          unzip -o audio-pack.zip
          rm -f audio-pack.zip audio-pack.b64
      - name: Commit audio files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Add hotline audio files [skip ci]' || exit 0
          git push
